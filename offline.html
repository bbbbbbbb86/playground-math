<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dcebf5">
<title>操場中的數學：需要網路</title>
<style>
  html, body { margin: 0; height: 100%; background: #dcebf5; color: #2b2a26;
    font-family: 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); box-sizing: border-box; }
  .card { background: #fff; border-radius: 18px; padding: 24px; max-width: 440px; box-shadow: 0 6px 20px rgba(43,42,38,.18); text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { font-size: 17px; line-height: 1.6; margin: 0 0 16px; }
  button { min-height: 52px; padding: 0 24px; border-radius: 12px; border: 0; background: #3d6b22; color: #fff; font-size: 18px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>目前沒有網路</h1>
    <p>練習器還沒有存到這台裝置裡。請連上網路後再開一次；第一次載入完成後，之後沒有網路也能打開。</p>
    <button type="button" onclick="location.reload()">重新載入</button>
  </div>
</main>
</body>
</html>
